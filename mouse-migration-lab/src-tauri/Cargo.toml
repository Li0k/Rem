[package]
name = "mouse-migration-lab"
version = "0.3.0"
description = "A local-first mouse migration instrument"
authors = ["Mouse Migration Lab"]
edition = "2021"

[lib]
name = "mouse_migration_lab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Input",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

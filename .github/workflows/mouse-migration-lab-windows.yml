name: Mouse Migration Lab Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'mouse-migration-lab/**'
      - '.github/workflows/mouse-migration-lab-windows.yml'

permissions:
  contents: read

jobs:
  windows-bundle:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mouse-migration-lab
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mouse-migration-lab/package-lock.json
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installers
        uses: tauri-apps/tauri-action@action-v1.0.0
        with:
          projectPath: mouse-migration-lab
          tauriScript: npm run desktop
          args: --bundles nsis,msi
          uploadWorkflowArtifacts: true
